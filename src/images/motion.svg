<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="url(#gradient)" stroke="none">
    <defs>
        <linearGradient id="gradient" gradientTransform="rotate(45)">
            <stop offset="0%" stop-color="#ffd3ba" />
            <stop offset="100%" stop-color="#ffa4eb" />
        </linearGradient>
        <filter id="shift-hue-1">
            <feColorMatrix type="hueRotate" values="90" />
            <feColorMatrix type="matrix" values="
                0.5 0 0 0 0.5
                0 0.5 0 0 0.5
                0 0 0.5 0 0.5
                0 0 0 1 0" />
        </filter>
        <filter id="shift-hue-2">
