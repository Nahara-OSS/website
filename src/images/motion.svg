<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 16 16"
    fill="url(#gradient)"
    stroke="url(#stroke-gradient)"
    stroke-width="0.5"
    paint-order="stroke">
    <defs>
        <linearGradient id="gradient" gradientTransform="scale(1.4) rotate(45)">
            <stop offset="0%" stop-color="#ffd5bb" />
            <stop offset="50%" stop-color="#ffa4eb" />
            <stop offset="100%" stop-color="#ff91d7" />
        </linearGradient>
        <linearGradient id="stroke-gradient" gradientTransform="scale(1.4) rotate(45)">
            <stop offset="0%" stop-color="#fffcf7" />
            <stop offset="100%" stop-color="#ff8fbe" />
        </linearGradient>
        <filter id="shift-hue-1">
            <feColorMatrix type="hueRotate" values="60" />
            <feColorMatrix type="matrix" values="
                0.4 0 0 0 0.6
                0 0.4 0 0 0.6
                0 0 0.4 0 0.6
                0 0 0 1 0" />
        </filter>
        <filter id="shift-hue-2">
            <feColorMatrix type="hueRotate" values="30" />
            <feColorMatrix type="matrix" values="
                0.7 0 0 0 0.3
                0 0.7 0 0 0.3
                0 0 0.7 0 0.3
                0 0 0 1 0" />
        </filter>
    </defs>
    <path d="M2,8 L4,8 L4,12 L8,12 L8,14 L2,14 Z" opacity="0.40" style="filter: url(#shift-hue-1);" />
    <path d="M5,5 L7,5 L7,9 L11,9 L11,11 L5,11 Z" opacity="0.60" style="filter: url(#shift-hue-2);" />
    <path d="M8,2 L14,2 L14,8 L8,8 Z" />
</svg>