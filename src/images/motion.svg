                0.75 0 0 0 0.25
                0 0.75 0 0 0.25
                0 0 0.75 0 0.25
                0 0 0 1 0" />
        </filter>
    </defs>
    <path d="M2,8 L4,8 L4,12 L8,12 L8,14 L2,14 Z" opacity="0.8" style="filter: url(#shift-hue-1);" />
    <path d="M5,5 L7,5 L7,9 L11,9 L11,11 L5,11 Z" opacity="0.9" style="filter: url(#shift-hue-2);" />
    <path d="M8,2 L14,2 L14,8 L8,8 Z" />
